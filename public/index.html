<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lingximanju · 无限画布智能体影像工坊</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff8a4c'/><path d='M9 10h14M9 16h14M9 22h9' stroke='%230d1016' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">◈</div>
      <div class="brand-text"><strong id="brand-title">lingximanju</strong><small id="brand-sub">无限画布 · 智能体制片</small></div>
      <button id="btn-sidebar-toggle" class="icon-btn" title="收起侧栏">‹</button>
    </div>

    <div class="side-scroll">
      <!-- 进入项目后只展示当前项目：项目导航 / 资源列表 / 项目设置。
           项目列表、新建、导入统一收敛到首页（顶栏 ⌂ 项目列表或面包屑）。 -->
      <div id="project-sidebar"></div>

      <!-- 画布工具只在画布视图出现，工作台 / 剧集详情不占用侧栏 -->
      <div id="side-canvas-tools">
        <section class="side-section">
          <div class="section-head"><span>流水线模板</span><span class="section-hint">点击应用</span></div>
          <div id="template-list" class="template-list"></div>
        </section>

        <section class="side-section">
          <div class="section-head"><span>节点库</span><span class="section-hint">拖入画布</span></div>
          <div id="node-palette" class="palette"></div>
        </section>

        <section class="side-section">
          <div class="section-head"><span>智能体</span><span class="section-hint" id="agent-count"></span></div>
          <div id="agent-list" class="agent-list"></div>
        </section>
      </div>
    </div>

    <div class="side-foot">
      <span class="dot-live"></span><span id="side-foot-text">本地运行 · 数据仅保存在 data/</span>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="tb-left">
        <button id="btn-sidebar-expand" class="icon-btn" title="展开侧栏" hidden>›</button>
        <div id="home-title" class="home-title" hidden><span>⌂</span> 项目列表</div>
        <div id="view-crumb" class="view-crumb" hidden></div>
        <div class="project-title" id="project-title-wrap">
          <span id="project-cover" class="tb-cover" aria-hidden="true"></span>
          <input id="project-name" spellcheck="false" aria-label="项目名称">
          <span id="project-mode" class="mode-chip"></span>
        </div>
        <button id="btn-close-project" class="icon-btn close-project" title="关闭当前项目，返回项目列表 (H)" aria-label="关闭项目" hidden>✕</button>
        <div id="step-chip" class="step-chip" hidden><span class="sc-dot"></span><span id="step-chip-text">0/6</span></div>
      </div>
      <div class="tb-center"><div id="run-status" class="run-status"><span class="rs-dot"></span><span id="run-status-text">就绪</span></div></div>
      <div class="tb-right">
        <!-- 应用级入口：只在项目列表页显示；打开项目后整页只讲当前项目 -->
        <button id="btn-config-chip" class="btn config-chip app-only" title="模型尚未配置完整，点击去设置" hidden>⚠ 模型未配置</button>
        <button id="btn-home" class="btn app-only" title="关闭当前项目，返回项目列表 (H)">⌂ 项目列表</button>
        <button id="btn-view-toggle" class="btn project-only" title="切换 项目工作台 / 画布视图">⬡ 画布</button>
        <button id="btn-step-run" class="btn primary canvas-only project-only" title="执行下一步任务 (S)" hidden>▶ 下一步</button>
        <button id="btn-project-manage" class="btn project-only in-more" title="项目管理：分集 / 产物 / 快照 / 标签">▦ 项目管理</button>
        <button id="btn-arrange" class="btn canvas-only project-only in-more" title="按依赖拓扑自动布局 (L)">⌗ 布局</button>
        <button id="btn-fit" class="btn canvas-only project-only" title="适应视图 (F)">⤢ 适应</button>
        <button id="btn-run" class="btn primary canvas-only project-only" title="运行完整流水线 (R)">▶ <span>运行完整流水线</span></button>
        <button id="btn-stop" class="btn danger canvas-only project-only" hidden>■ 停止</button>
        <button id="btn-director-pack" class="btn canvas-only project-only in-more" title="生成并下载导演包（可导入 ComfyUI 导演工作台）">▤ 导演包</button>
        <span class="tb-sep project-only in-more"></span>
        <button id="btn-export" class="icon-btn project-only in-more" title="导出项目 JSON">⇩</button>
        <button id="btn-asset-lib" class="icon-btn in-more" title="资源库：已生成资源统一管理与复用">▣</button>
        <button id="btn-settings" class="icon-btn app-only" title="模型与运行设置">⚙</button>
        <button id="btn-theme" class="icon-btn app-only" title="切换主题 (T)">☀</button>
        <button id="btn-help" class="icon-btn app-only" title="快捷键帮助 (?)">?</button>
        <!-- 项目内把次要操作收进「更多」，顶栏只保留当前动作 -->
        <div class="more-wrap project-only">
          <button id="btn-more" class="icon-btn" title="更多操作" aria-label="更多操作">···</button>
          <div id="more-menu" class="more-menu" hidden>
            <div class="more-group">当前项目</div>
            <button data-more="source">📖 查看原著与统计</button>
            <button data-more="seasons">▥ 分季 / 分集管理</button>
            <button data-more="assets">▣ 资源归纳</button>
            <button data-more="overall">🌐 全部组合画布</button>
            <div class="more-group">工具</div>
            <button data-target="btn-project-manage">▤ 项目管理面板</button>
            <button data-target="btn-asset-lib">▣ 完整资源库</button>
            <button data-target="btn-director-pack">🎬 生成导演包</button>
            <button data-target="btn-export">⇩ 导出项目 JSON</button>
            <button data-target="btn-arrange">⌗ 自动布局</button>
            <div class="more-group">外观与设置</div>
            <button data-target="btn-settings">⚙ 模型与运行设置</button>
            <button data-target="btn-theme">◐ 切换主题</button>
            <button data-target="btn-help">? 操作指引</button>
          </div>
        </div>
      </div>
      <div id="top-progress" class="top-progress" hidden><i></i></div>
    </header>

    <div id="workspace">
      <section id="home-view" hidden></section>
      <section id="episode-view" hidden></section>

      <div id="canvas-wrapper" tabindex="0">
        <div id="grid"></div>
        <div id="canvas-viewport">
          <svg id="edge-layer" width="12000" height="12000" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="node-layer"></div>
        </div>
        <div id="selection-box" hidden></div>
        <div id="connect-line" hidden><svg width="100%" height="100%"><path id="connect-path" fill="none"></path></svg></div>

        <div id="canvas-empty" class="empty-state" hidden>
          <div class="empty-icon">◈</div>
          <h3>画布空空如也</h3>
          <p id="canvas-empty-tip">从左侧节点库拖入一个节点，或应用一套流水线模板。</p>
        </div>

        <button id="canvas-offscreen" class="offscreen-hint" hidden>节点在视口外 · 点击回到内容 ⤢</button>

        <div id="canvas-toolbar" class="canvas-toolbar">
          <button data-act="zoom-in" title="放大">＋</button>
          <span id="zoom-label">100%</span>
          <button data-act="zoom-out" title="缩小">－</button>
          <button data-act="fit" title="适应视图">⤢</button>
          <button data-act="layout" title="自动布局">⌗</button>
        </div>

        <div id="minimap" class="minimap"><canvas id="minimap-canvas" width="220" height="140"></canvas><span class="minimap-label">导航图</span></div>
        <div id="canvas-hint" class="canvas-hint">空格 + 拖拽平移 · 滚轮缩放 · 端口拖出连线 · 右键节点更多操作</div>
        <!-- 画布范围：全部组合画布 / 项目主画布 / 每一集的独立画布 -->
        <div id="canvas-scopebar" class="cs-bar">
          <span class="cs-icon">⬡</span>
          <select id="canvas-scope" class="cs-select" aria-label="选择画布范围"></select>
          <span id="canvas-scope-hint" class="cs-hint"></span>
          <button id="btn-scope-fit" class="cs-btn" title="适应当前画布 (F)">⤢</button>
        </div>
        <div id="canvas-stepbar" class="canvas-stepbar" hidden></div>
      </div>

      <div id="project-view" hidden></div>

      <aside id="inspector">
        <div class="insp-tabs">
          <button class="insp-tab active" data-tab="props">节点属性</button>
          <button class="insp-tab" data-tab="steps">任务步骤</button>
          <button class="insp-tab" data-tab="agent">Agent 对话</button>
          <button id="btn-insp-toggle" class="icon-btn" title="收起面板">›</button>
        </div>
        <div id="insp-props" class="insp-body"></div>
        <div id="insp-steps" class="insp-body" hidden></div>
        <div id="insp-agent" class="insp-body" hidden>
          <div class="agent-intro">画布协作者能读到整张图：节点、连线、状态与产物。用 <code>@节点ID</code> 指向具体节点。</div>
          <div id="chat-log" class="chat-log"></div>
          <div class="chat-chips">
            <button data-q="项目进度">项目进度</button>
            <button data-q="整理画布">整理画布</button>
            <button data-q="检查一致性">检查一致性</button>
            <button data-q="下一步做什么">下一步</button>
          </div>
          <div class="chat-compose">
            <textarea id="chat-input" rows="2" placeholder="例如：给场景补 4 个镜头 / 解释 @n_1 的依赖"></textarea>
            <button id="btn-send" class="btn primary">发送 ↵</button>
          </div>
        </div>
      </aside>
    </div>

    <footer id="statusbar">
      <div class="status-left">
        <span class="status-tag">运行日志</span>
        <div id="log-stream" class="log-stream"></div>
      </div>
      <div class="status-right">
        <span id="stat-home" hidden></span>
        <span id="stat-nodes">0 节点</span>
        <span id="stat-edges">0 连线</span>
        <span id="stat-provider" class="provider-chip">mock</span>
        <span id="stat-zoom">100%</span>
      </div>
    </footer>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="context-menu" class="context-menu" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
